<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerTigem - Em Breve</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #111a11 0%, #050505 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Ícone de play estilizado */
        .icone-play {
            font-size: 60px;
            color: #00ff66;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #00ff66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #aaaaaa;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        p {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .botao-youtube {
            display: inline-block;
            background-color: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .botao-youtube:hover {
            background-color: #00ff66;
            color: #050505;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.6);
            transform: translateY(-3px);
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Responsividade para celular */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 0.9rem; letter-spacing: 2px; }
            .icone-play { font-size: 50px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icone-play">▶</div>
        <h1>VerTigem</h1>
        <h2>Em Breve</h2>
        
        <p>Estamos preparando as melhores batidas e sets de música eletrônica para você. <br>Fique ligado, o som está prestes a começar.</p>
        
        <!-- LINK ATUALIZADO AQUI -->
        <a href="https://www.youtube.com/@VerTigem-v1x" target="_blank" class="botao-youtube">Inscreva-se no Canal</a>
    </div>

</body>
</html>
